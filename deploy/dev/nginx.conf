worker_processes 2;
worker_shutdown_timeout 10s;
pid /run/agiru/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /run/agiru/client-body;
    proxy_temp_path /run/agiru/proxy;
    fastcgi_temp_path /run/agiru/fastcgi;
    uwsgi_temp_path /run/agiru/uwsgi;
    scgi_temp_path /run/agiru/scgi;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    client_max_body_size 1m;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        location /assets/ {
            alias /usr/share/agiru/web/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream off;
            proxy_cache off;
            proxy_redirect off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            proxy_send_timeout 15s;
        }
    }
}
